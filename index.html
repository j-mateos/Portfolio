<!doctype html>
<html lang="es">
    <head>
        <!-- Basic elements -->
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Juan Manuel</title>

        <!-- SEO elements -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Este es un portfolio web que muestra el currículum de Juan Manuel Mateos"
        />

        <!-- Open Graph elements -->
        <meta property="og:title" content="Portfolio - Juan Manuel Mateos" />
        <meta
            property="og:description"
            content="Este es un portfolio web que muestra el currículum de Juan Manuel Mateos"
        />

        <script>
            ;(function () {
                try {
                    var saved = localStorage.getItem('theme-mode')
                    var mode =
                        saved === 'light' || saved === 'dark'
                            ? saved
                            : window.matchMedia('(prefers-color-scheme: light)').matches
                              ? 'light'
                              : 'dark'
                    document.documentElement.classList.add(mode)

                    var lang = localStorage.getItem('app-language')
                    if (lang === 'es' || lang === 'en') document.documentElement.lang = lang
                } catch (e) {}
            })()
        </script>
    </head>

    <body>
        <!-- Content -->
        <div id="root"></div>

        <!-- Scripts -->
        <script type="module" src="./src/main.jsx"></script>
    </body>
</html>
